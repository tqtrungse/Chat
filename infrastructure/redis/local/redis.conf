################################## NETWORK ##################################
# Redis listens inside the container. Docker publishes it only on host loopback.
bind 0.0.0.0
port 6379
protected-mode yes
# Password is supplied by docker-compose using REDIS_PASSWORD.

# Maintain TCP Keepalive to detect early "quietly" broken connections from the Hub.
# Sends TCP keepalive probes every 60 seconds on idle connections.
tcp-keepalive 60

# Get thundering-herd when N hub reconnects after restart/network
# recovery partition (each hub reopens the entire pool at the same time).
# You must ensure that the Linux net.core.somaxconn parameter is greater than or equal to 2048.
# If the OS is set lower (for example, the default of old Linux is usually 128 or 1024),
# then the application's number 2048 will be ignored by the OS and automatically forced down
# (captured/truncated) to be equal to the OS limit.
tcp-backlog 2048

################################# GENERAL ####################################
# Run Redis in background mode (if deployed on Linux bare-metal)
# daemonize yes

################################# CLIENTS ###################################
# N_hub ~ 10-20 (based on target 100k devices/hub, total 1M devices).
# Each hub: pool connection + 4 subscriptions (add-hub, del-hub,
#del-device, expired). For example, 20 hubs x (100 pools + 4) = ~2080 is fine
# concentration; Multiply the safety factor for rolling deployment (old +
# new temporary overlap time) and admin/monitoring tools.
maxclients 5000

# client-output-buffer-limit <class> <hard limit> <soft limit> <soft seconds>
# Buffer limit for pub/sub clients: Stop immediately if it exceeds 4MB,
# or interrupt if exceeding 1MB continuously for 30 seconds.
client-output-buffer-limit pubsub 4mb 1mb 30

################################# MEMORY #####################################
# With 1 million devices, the actual RAM usage is approximately 180MB.
# Grant 2GB (or 1GB) to have space for connections, buffers, and traffic bursts.
maxmemory 2gb

# EVICTION STRATEGY (Important!)
# Absolutely DO NOT use automatic deletion policies (like allkeys-lru).
# Your system uses Redis as the "State Store" (device owner management).
# If Redis arbitrarily deletes the device key to free up RAM, the Hub will lose its state.
# 'noeviction' will return an error (OOM) to let the application know instead of
# silently corrupting data.
maxmemory-policy noeviction

# With frequent addition/removal of devices, RAM can become fragmented over time.
# Enable Redis automatic garbage collection in the background.
# Only works with jemalloc allocator, not with libc malloc.
# Must verify it.
activedefrag yes

############################# LISTPACK TUNING ################################
# Core memory optimization for buckets 'devices:{bucket}' and 'devices:sync:{bucket}'.
# With 1 million devices divided by 4,096 buckets, each bucket has an average of 244 entries.
# Raise the default limit from 512 to 1024 to guard against the Allocation Modulo algorithm
# irregular (skew), ensuring 100% Hash is always in compressed RAM state (listpack).
hash-max-listpack-entries 1024

# Value length are string uint64 numbers (less than 32 bytes).
# Leave 64 bytes as plenty of space and keep the compression structure extremely tight.
hash-max-listpack-value 64

# Maximum size for Set (used for 'hub:devices:<hubID>' and 'hubs').
# Memory Encoding Threshold.
set-max-intset-entries 200000
set-max-listpack-entries 128
set-max-listpack-value 64

########################### KEYSPACE EVENTS #################################
# ENABLE EVENT NOTIFICATION FEATURE (Required for Crash Detection)
# The letter 'E' (Keyevent events), the letter 'x' (Expired events).
# Even though in the code (ensureExpiredNotifications function) you used CONFIG SET,
# hardwriting here is required if you run on Managed Redis
# (like AWS ElasticCache) often blocks CONFIG commands at runtime.
notify-keyspace-events Ex

################################ PERSISTENCE ################################
# Turn off AOF (Append Only File) because the offline message stream is assigned
# to NATS JetStream, Redis only saves real-time connection state.
# Enabling AOF only wastes disk I/O.
appendonly no

# Turn off RDB completely: no more data must survive restart.
# If you want to avoid "every hub+device must re-add Redis at the same time"
# after 1 scheduled maintenance restart (not because of correctness,
# just to reduce reconnect-storm load), change to a sparse snapshot:
# save 3600 1