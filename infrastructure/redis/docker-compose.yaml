services:
  redis:
    image: redis:8.10-alpine
    container_name: hub-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 2200m # dư nhẹ so với maxmemory 2gb trong config, tránh OOM-killer đụng maxmemory-policy noeviction
    ulimits:
      nofile:
        soft: 65536
        hard: 65536