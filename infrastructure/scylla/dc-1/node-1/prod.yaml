# =============================================================================
# Cluster identity
# =============================================================================

cluster_name: xxx-hub-scylla

# Initial seed node(s) used for cluster discovery.
# Do NOT list every node here.
seeds: "127.0.0.1"

# =============================================================================
# Network
# =============================================================================

# Address used by Scylla for internode communication.
listen_address: 127.0.0.1

# Address advertised to other nodes.
# Usually the same as listen_address when using a normal private network.
broadcast_address: 127.0.0.1

# CQL client address.
rpc_address: 127.0.0.1

# Address advertised to clients.
# Usually the same as rpc_address.
broadcast_rpc_address: 127.0.0.1

# Native CQL port without TLS.
# Keep the default disabled if clients should use TLS only.
native_transport_port: 9042

# Native CQL TLS port.
native_transport_port_ssl: 9142

# =============================================================================
# Topology
# =============================================================================

# Production deployment with DC/rack awareness.
endpoint_snitch: GossipingPropertyFileSnitch

# =============================================================================
# Security / authentication
# =============================================================================

# Enable username/password authentication.
authenticator: PasswordAuthenticator

# Enable authorization based on roles/GRANTs.
authorizer: CassandraAuthorizer

# =============================================================================
# Client -> Scylla TLS
# =============================================================================

client_encryption_options:
  enabled: true

  # Certificate signed by your Private CA.
  certificate: node-1.cert.pem

  # Private key corresponding to the certificate above.
  keyfile: node-1.key.pem

  # Your Private CA certificate.
  truststore: /etc/scylla/certs/ca.cert.pem

  # Go clients authenticate using username/password,
  # not client certificates.
  require_client_auth: false

# =============================================================================
# Node -> Node communication
# =============================================================================

server_encryption_options:
  internode_encryption: all

  # Each node should have its own certificate/key.
  certificate: node-1.cert.pem
  keyfile: node-1.key.pem

  # Trust the same Private CA.
  truststore: /etc/scylla/certs/ca.cert.pem

  # Nodes authenticate each other using their certificates.
  require_client_auth: true

# =============================================================================
# Compression
# =============================================================================

# No compression between Scylla nodes.
internode_compression: none

# =============================================================================
# Other
# =============================================================================

# Keep this aligned across all nodes.
num_tokens: 256