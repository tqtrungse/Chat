listen: "0.0.0.0:4222"

authorization {
  users: [
    {
      user: "hub-1"
      password: $HUB_1_PASSWORD
      permissions: {
        publish: { allow: ["local.hub.*"] }
        subscribe: { allow: ["local.hub.1"] }
      }
    }
    {
      user: "hub-2"
      password: $HUB_2_PASSWORD
      permissions: {
        publish: { allow: ["local.hub.*"] }
        subscribe: { allow: ["local.hub.2"] }
      }
    }
  ]
}